server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. LOGS DE CONTAINERS DOCKER (ABORDAGEM DIRETA)
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: 'docker-logs'
          host: 'localhost'
          environment: 'sysflow'
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          stream:
      - output:
          source: log

  # 2. LOGS DO SISTEMA
  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: 'system-logs'
          host: 'localhost'
          environment: 'sysflow'
          __path__: /var/log/*.log

  # 3. LOGS ESPECÍFICOS DO N8N (se existirem)
  - job_name: n8n-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: 'n8n-app'
          host: 'localhost'
          environment: 'sysflow'
          app: 'n8n'
          __path__: /var/lib/docker/containers/*sysflow-n8n*/*-json.log
