server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Logs Docker - TODOS os containers
  - job_name: docker
    static_configs:
      - targets: ['localhost']
        labels:
          job: 'docker-logs'
          host: 'localhost'
          environment: 'sysflow'
        __path__: /var/lib/docker/containers/*/*-json.log

  # 2. Logs do sistema (opcional)
  - job_name: system
    static_configs:
      - targets: ['localhost']
        labels:
          job: 'system-logs'
          host: 'localhost'
        __path__: /var/log/*.log
