# ===================================================================
# NOC BEUNI - PROVA DE CONCEITO (PoC) PARA O CENTRO DE OPERAÇÕES
# ===================================================================
# Objetivo: Demonstrar uma stack de observabilidade mínima e funcional
# para monitorar integrações críticas e saúde de sistemas, provando a
# capacidade de adaptação rápida aos KPIs reais do negócio.
# ===================================================================

services:
  # [1] ARMAZENAMENTO DE LONGO PRAZO (Base para métricas históricas e tendências)
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: sysflow-timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sysflow
      - POSTGRES_USER=sysflow_admin
      - POSTGRES_PASSWORD=${TIMESCALEDB_PASSWORD}
      - POSTGRES_LOG_STATEMENT=all  # Loga todas as queries
      - POSTGRES_LOG_TIMEZONE=UTC
      - POSTGRESQL_LOG_MIN_DURATION_STATEMENT=0  # Loga todas as queries independente do tempo
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - sysflow-network

  # [2] COLETA E AGREGAÇÃO DE DADOS (Coração da Observabilidade)
  # Coleta de métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: sysflow-prometheus
    restart: unless-stopped
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./configs/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    ports:
      - "9090:9090"
    networks:
      - sysflow-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'

  # Gerenciamento inteligente de alertas
  alertmanager:
    image: prom/alertmanager:latest
    container_name: sysflow-alertmanager
    restart: unless-stopped
    volumes:
      - ./configs/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks:
      - sysflow-network
    depends_on:
      - prometheus

  # Agregação de logs (para troubleshooting integrado)
  loki:
    image: grafana/loki:2.9.0
    container_name: sysflow-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./configs/loki/local-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - sysflow-network

  promtail:
    image: grafana/promtail:2.9.0
    container_name: sysflow-promtail
    restart: unless-stopped
    volumes:
      - ./configs/loki/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - sysflow-network
    depends_on:
      - loki

  # [3] VISUALIZAÇÃO - PAINEL ÚNICO DO NOC (Single Pane of Glass)
  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: sysflow-grafana
    restart: unless-stopped
    environment:
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3000:3000"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - sysflow-network
    depends_on:
      - prometheus
      - loki

  # [4] AUTOMAÇÃO E RESPOSTA A INCIDENTES (Orquestração de Alertas)
  n8n:
    image: n8nio/n8n:latest
    container_name: sysflow-n8n
    restart: unless-stopped
    environment:
      # Autenticação e Configuração Básica
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PROTOCOL=http
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      # Métricas Expostas (Para Auto-monitoramento da Stack)
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
      - N8N_METRICS_INCLUDE_API_METRICS=true
      - N8N_METRICS_INCLUDE_WEBHOOK_METRICS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_METRICS=true
      - N8N_METRICS_INCLUDE_NODE_METRICS=true
      # Configurações de Execução
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_MODE=regular
      # Localização e Logs
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console
      - N8N_PERSONALIZATION_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=true
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./configs/n8n:/etc/n8n
    networks:
      - sysflow-network
    depends_on:
      - timescaledb
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -T 5 -O - http://127.0.0.1:5678/healthz 2>&1 | grep -qF '{\"status\":\"ok\"}'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # [5] MONITORAMENTO DE INFRAESTRUTURA (Escalável para ambientes maiores)
  # Métricas do Host/Servidor
  node-exporter:
    image: prom/node-exporter:latest
    container_name: sysflow-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - sysflow-network

  # Métricas por Container (Detalhamento de recursos)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sysflow-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - sysflow-network

networks:
  sysflow-network:
    driver: bridge

volumes:
  timescaledb_data:
  loki_data:
  grafana_data:
  n8n_data:
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    environment:
