server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Logs do sistema (funciona)
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          __path__: /var/log/*.log

  # 2. Logs de TODOS os containers Docker (genérico e necessário)
  - job_name: containerlogs
    static_configs:
      - targets: [localhost]
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*.log

  # 3. Logs ESPECÍFICOS do n8n (VERSÃO SIMPLIFICADA - SEM PIPELINE_STAGES)
  - job_name: n8n-specific
    static_configs:
      - targets: [localhost]
        labels:
          job: n8n
          service: beuni-automation
          __path__: /var/lib/docker/containers/*/*-json.log
